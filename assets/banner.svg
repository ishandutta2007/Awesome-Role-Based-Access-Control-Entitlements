<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="node-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="node-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="node-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes beacon {
        0% { r: 6px; opacity: 1; }
        100% { r: 24px; opacity: 0; }
      }
      .anim-dash {
        stroke-dasharray: 6 6;
        animation: dash 2.5s linear infinite;
      }
      .anim-beacon {
        animation: beacon 2.4s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .anim-grid {
        animation: pulseGrid 4s ease-in-out infinite;
      }
      .bg-particles {
        animation: floatSlow 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="14" fill="url(#bg-grad)"/>

  <!-- Subtle Animated Grid Pattern in Background -->
  <g class="anim-grid" stroke="#334155" stroke-width="0.8">
    <line x1="100" y1="0" x2="100" y2="360" stroke-opacity="0.25"/>
    <line x1="250" y1="0" x2="250" y2="360" stroke-opacity="0.25"/>
    <line x1="400" y1="0" x2="400" y2="360" stroke-opacity="0.25"/>
    <line x1="550" y1="0" x2="550" y2="360" stroke-opacity="0.25"/>
    <line x1="700" y1="0" x2="700" y2="360" stroke-opacity="0.25"/>
    <line x1="850" y1="0" x2="850" y2="360" stroke-opacity="0.25"/>
    <line x1="1000" y1="0" x2="1000" y2="360" stroke-opacity="0.25"/>
    <line x1="1150" y1="0" x2="1150" y2="360" stroke-opacity="0.25"/>

    <line x1="0" y1="60" x2="1200" y2="60" stroke-opacity="0.25"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke-opacity="0.25"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke-opacity="0.25"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke-opacity="0.25"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke-opacity="0.25"/>
  </g>

  <!-- Dynamic Authorization Flow (Background side) -->
  <g class="bg-particles" opacity="0.65">
    <!-- Connecting animated dash lines between auth nodes -->
    <path d="M 850 180 L 970 100" stroke="#38bdf8" stroke-width="2" class="anim-dash" fill="none"/>
    <path d="M 850 180 L 970 260" stroke="#818cf8" stroke-width="2" class="anim-dash" fill="none"/>
    <path d="M 970 100 L 1100 130" stroke="#c084fc" stroke-width="2" class="anim-dash" fill="none"/>
    <path d="M 970 260 L 1100 230" stroke="#34d399" stroke-width="2" class="anim-dash" fill="none"/>

    <!-- Pulse beacon rings -->
    <circle cx="850" cy="180" r="10" fill="none" stroke="#38bdf8" class="anim-beacon"/>
    <circle cx="970" cy="100" r="10" fill="none" stroke="#818cf8" class="anim-beacon" style="animation-delay: 0.8s;"/>
    <circle cx="970" cy="260" r="10" fill="none" stroke="#34d399" class="anim-beacon" style="animation-delay: 1.6s;"/>

    <!-- Graph Nodes: Subject -> Role -> Permission -> Resource -->
    <!-- Node 1: Identity / Subject -->
    <rect x="805" y="155" width="90" height="50" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="850" y="185" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">👤 Subject</text>

    <!-- Node 2: Role / Group -->
    <rect x="925" y="75" width="90" height="50" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.8"/>
    <text x="970" y="105" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">🛡️ Role</text>

    <!-- Node 3: Policy / Entitlement -->
    <rect x="925" y="235" width="90" height="50" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.8"/>
    <text x="970" y="265" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">📜 Entitlement</text>

    <!-- Node 4: Resource -->
    <rect x="1055" y="105" width="95" height="50" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.8"/>
    <text x="1102" y="135" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">📦 Resource</text>

    <!-- Node 5: Action -->
    <rect x="1055" y="205" width="95" height="50" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="1102" y="235" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">⚡ Action</text>
  </g>

  <!-- Foreground Title and Subtitle Area (Completely unobstructed) -->
  <g transform="translate(70, 0)">
    <!-- Security Shield Emblem -->
    <g transform="translate(0, 70)">
      <circle cx="36" cy="36" r="34" fill="url(#shield-grad)" filter="url(#glow)" opacity="0.3"/>
      <rect x="0" y="0" width="72" height="72" rx="20" fill="url(#shield-grad)"/>
      <path d="M 36 18 L 52 25 C 52 38 45 50 36 54 C 27 50 20 38 20 25 Z" fill="#ffffff" opacity="0.95"/>
      <path d="M 32 35 L 36 39 L 43 31" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Title Badge -->
    <rect x="90" y="70" width="180" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="104" cy="84" r="5" fill="#10b981"/>
    <text x="116" y="89" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">CURATED AWESOME LIST</text>

    <!-- Main Title -->
    <text x="0" y="172" fill="url(#text-grad)" font-size="36" font-weight="800" letter-spacing="-0.5">
      Role-Based Access Control
    </text>
    <text x="0" y="214" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">
      &amp; Entitlements Hub 🔐
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="254" fill="#94a3b8" font-size="15" font-weight="400">
      The authoritative index of enterprise IAM, cloud IGA, ReBAC (Zanzibar), and Policy Decision engines.
    </text>

    <!-- Tag Pills -->
    <g transform="translate(0, 278)">
      <rect x="0" y="0" width="90" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="45" y="17" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">⚡ RBAC</text>

      <rect x="100" y="0" width="100" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="150" y="17" fill="#818cf8" font-size="11" font-weight="700" text-anchor="middle">🛡️ IGA &amp; PIM</text>

      <rect x="210" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="282" y="17" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">🌐 ReBAC (Zanzibar)</text>

      <rect x="365" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="427" y="17" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">⚖️ Policy Engines</text>

      <rect x="500" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="557" y="17" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">☁️ Multi-Cloud</text>
    </g>
  </g>
</svg>